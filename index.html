<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Story</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
background:black;
}

/* BACKGROUND PHOTO */

.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:url('dewi.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
z-index:-2;

animation:zoomBackground 20s ease-in-out infinite alternate;
}

/* DARK OVERLAY */

.background-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
to right,
rgba(0,0,0,0.92) 15%,
rgba(0,0,0,0.65) 50%,
rgba(0,0,0,0.75) 100%
);

z-index:-1;
}

@keyframes zoomBackground{
from{
transform:scale(1);
}
to{
transform:scale(1.08);
}
}

/* NAVBAR */

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
padding:25px 60px;
display:flex;
justify-content:space-between;
align-items:center;

background:linear-gradient(
to bottom,
rgba(0,0,0,0.85),
transparent
);
}

.logo{
color:#E50914;
font-size:28px;
font-weight:bold;
letter-spacing:3px;
text-shadow:0 0 15px rgba(229,9,20,.6);
}

/* HERO */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding-left:80px;
max-width:700px;
}

.tag{
font-size:12px;
letter-spacing:4px;
color:#bdbdbd;
margin-bottom:15px;
}

.hero h1{
font-size:72px;
line-height:1.05;
margin-bottom:15px;
text-shadow:0 0 25px rgba(0,0,0,.5);
}

.subtitle{
font-size:20px;
line-height:1.7;
color:#d9d9d9;
margin-bottom:25px;
}

.dedication{
font-size:24px;
color:#ff6b6b;
margin-bottom:30px;
}

/* BUTTON */

.btn{
padding:16px 32px;
font-size:18px;
background:#E50914;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
width:220px;

transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* FOOTER */

.footer-note{
position:absolute;
bottom:40px;
left:80px;
font-size:14px;
color:#9d9d9d;
letter-spacing:1px;
}

/* FADE */

.fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:black;
opacity:0;
pointer-events:none;
transition:opacity 1s ease;
z-index:999;
}

/* MOBILE */

@media(max-width:768px){

.hero{
padding:30px;
max-width:100%;
}

.hero h1{
font-size:48px;
}

.subtitle{
font-size:16px;
}

.footer-note{
left:30px;
bottom:30px;
}

}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="background"></div>
<div class="background-overlay"></div>

<!-- NAVBAR -->
<div class="navbar">
<div class="logo">BIRTHDAY ORIGINALS</div>
</div>

<!-- HERO -->
<div class="hero">

<div class="tag">
A BIRTHDAY ORIGINAL FILM
</div>

<h1>
Happy Birthday,<br>
Dewi Rinjani
</h1>

<p class="subtitle">
A collection of memories, laughter, love,
and beautiful moments created to celebrate
your special day.
</p>

<div class="dedication">
Made With Love ❤️
</div>

<button class="btn" onclick="playFilm()">
▶ Begin The Story
</button>

</div>

<div class="footer-note">
Press play to begin the celebration
</div>

<!-- FADE -->
<div class="fade" id="fade"></div>

<script>

function playFilm(){

const fade = document.getElementById("fade");

fade.style.opacity = "1";

setTimeout(() => {

window.location.href = "movie.html";

},1000);

}

</script>

</body>
</html>
