<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>A Birthday Film</title>

<style>

body {
margin: 0;
background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
color: white;
font-family: Arial, sans-serif;
overflow: hidden;
}

/* NAVBAR */
.navbar {
position: fixed;
top: 0;
width: 100%;
padding: 20px 50px;
display: flex;
justify-content: space-between;
align-items: center;
background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
}

.logo {
color: red;
font-size: 26px;
font-weight: bold;
letter-spacing: 2px;
}

/* HERO */
.hero {
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
padding-left: 70px;
position: relative;
}

.tag {
color: #aaa;
letter-spacing: 3px;
font-size: 12px;
margin-bottom: 10px;
}

h1 {
font-size: 60px;
margin: 0;
line-height: 1.1;
}

.subtitle {
font-size: 18px;
color: #ccc;
max-width: 600px;
margin-top: 15px;
line-height: 1.5;
}

.dedication {
margin-top: 20px;
font-size: 20px;
color: #ff4d4d;
letter-spacing: 1px;
}

/* BUTTON */
.btn {
margin-top: 30px;
padding: 14px 28px;
font-size: 18px;
background: red;
border: none;
color: white;
cursor: pointer;
width: fit-content;
transition: 0.3s;
}

.btn:hover {
transform: scale(1.05);
background: #ff1a1a;
}

/* FOOTER TEXT */
.footer-note {
position: absolute;
bottom: 40px;
left: 70px;
color: #888;
font-size: 14px;
}

/* FADE OVERLAY */
.fade {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100vh;
background: black;
opacity: 0;
pointer-events: none;
transition: opacity 1s ease;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<div class="logo">NETFLIX</div>
</div>

<!-- HERO -->
<div class="hero">

<div class="tag">BIRTHDAY STORY</div>

<h1>Her Special Day</h1>

<p class="subtitle">
A personal film documenting one special day that means everything —
captured in memories, time, and love.
</p>

<div class="dedication">For Dewi Rinjani ❤️</div>

<button class="btn" onclick="playFilm()">▶ Play Film</button>

<div class="footer-note">
Press play to begin the celebration
</div>

</div>

<!-- FADE -->
<div class="fade" id="fade"></div>

<script>

function playFilm() {
const fade = document.getElementById('fade');
fade.style.opacity = 1;

setTimeout(() => {
window.location.href = "movie.html";
}, 1000);
}

</script>

</body>
</html>
