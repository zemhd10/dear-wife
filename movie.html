<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Originals - Perjalanan Kita</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#000;
color:#fff;
overflow:hidden;
}

/* FADE LAYER */
#fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
z-index:9999;
opacity:0;
pointer-events:none;
transition:opacity 0.8s ease;
}

/* LOADING */
.loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
animation:hideLoading 2s forwards;
}

.loading h1{
color:red;
letter-spacing:4px;
}

@keyframes hideLoading{
80%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}

/* INTRO */
.intro{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
transition:0.8s;
}

.tag{
font-size:12px;
letter-spacing:3px;
color:#aaa;
margin-bottom:15px;
}

.title{
font-size:56px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
color:#ccc;
max-width:700px;
line-height:1.6;
margin-bottom:20px;
}

.name{
font-size:26px;
color:#ff4d4d;
margin-bottom:30px;
}

.btn{
background:red;
color:white;
border:none;
padding:14px 28px;
font-size:16px;
cursor:pointer;
border-radius:4px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* VIDEO SECTION */
.video-section{
display:none;
height:100vh;
padding:40px;
text-align:center;
opacity:0;
transition:1s;
}

.video-section h1{
margin-bottom:10px;
}

.video-section p{
color:#aaa;
margin-bottom:20px;
}

.video-wrapper{
display:flex;
justify-content:center;
}

iframe{
width:85%;
max-width:1000px;
height:550px;
border:none;
border-radius:12px;
}

.action{
margin-top:25px;
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

</style>

</head>

<body>

<div class="loading">
<h1>BIRTHDAY ORIGINALS</h1>
</div>

<div id="fade"></div>

<!-- INTRO -->

<div class="intro" id="intro">

<div class="tag">A BIRTHDAY ORIGINAL FILM</div>

<h1 class="title">A Film for Your Special Day</h1>

<p class="subtitle">
A personal story captured to celebrate one meaningful birthday,
filled with memories, laughter, and love.
</p>

<div class="name">
For Dewi Rinjani ❤️
</div>

<button class="btn" onclick="startFilm()">
▶ Start Watching
</button>

</div>

<!-- VIDEO -->

<div class="video-section" id="videoSection">

<h1>Chapter 1 — Perjalanan Kita</h1>

<p>
A Birthday Story of Love, Time, and Us
</p>

<div class="video-wrapper">

<iframe
src="https://drive.google.com/file/d/1xCSRGZl7J3Wl0JNFsg2zxpvGWsFV9ZWE/preview"
allow="autoplay"
allowfullscreen>
</iframe>

</div>

<div class="action">

<button class="btn" onclick="goMemories()">
💖 Lihat Kenangan
</button>

<button class="btn" onclick="goHome()">
🏠 Kembali
</button>

</div>

</div>

<script>

function startFilm(){

const intro = document.getElementById("intro");
const video = document.getElementById("videoSection");

intro.style.opacity = "0";

setTimeout(() => {

intro.style.display = "none";

video.style.display = "block";

setTimeout(() => {
video.style.opacity = "1";
},100);

},800);

}

function goMemories(){

const fade = document.getElementById("fade");

fade.style.opacity = "1";

setTimeout(() => {
window.location.href = "memories.html";
},800);

}

function goHome(){

const fade = document.getElementById("fade");

fade.style.opacity = "1";

setTimeout(() => {
window.location.href = "index.html";
},800);

}

</script>

</body>
</html>
