<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BIRTHDAY ORIGINALS</title>

<style>

body {
margin: 0;
background: black;
color: white;
font-family: Arial, sans-serif;
overflow: hidden;
opacity: 0;
animation: fadeIn 1s ease forwards;
}

/* LOADING */
#loadingScreen {
position: fixed;
width: 100%;
height: 100vh;
background: black;
display: flex;
justify-content: center;
align-items: center;
z-index: 999;
animation: fadeOutLoad 2s ease forwards;
animation-delay: 1.2s;
}

.logo {
color: red;
font-size: 28px;
letter-spacing: 4px;
}

/* INTRO */
.intro {
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
transition: opacity 0.8s ease;
}

h1 {
font-size: 42px;
margin: 10px 0;
}

h2 {
font-size: 28px;
}

.btn {
margin-top: 20px;
padding: 12px 25px;
background: red;
border: none;
color: white;
cursor: pointer;
}

/* VIDEO */
.video-section {
position: absolute;
width: 100%;
height: 100%;
display: none;
opacity: 0;
transition: opacity 1s ease;
text-align: center;
padding-top: 60px;
}

iframe {
width: 80%;
height: 500px;
border: none;
border-radius: 10px;
}

/* CINEMATIC BLACK FADE */
#fade {
position: fixed;
width: 100%;
height: 100vh;
background: black;
z-index: 2000;
opacity: 0;
pointer-events: none;
transition: opacity 1s ease;
}

/* ANIMATIONS */
@keyframes fadeIn {
to { opacity: 1; }
}

@keyframes fadeOutLoad {
to { opacity: 0; visibility: hidden; }
}

</style>
</head>

<body>

<div id="loadingScreen">
  <div class="logo">BIRTHDAY ORIGINALS</div>
</div>

<!-- BLACK FADE LAYER -->
<div id="fade"></div>

<!-- INTRO -->
<div class="intro" id="intro">

<h1>Perjalanan Kita</h1>
<h2>Dewi Rinjani</h2>

<button class="btn" onclick="startFilm()">▶ Start Watching</button>

</div>

<!-- VIDEO -->
<div class="video-section" id="videoSection">

<h1>Chapter 1 — Our Story</h1>

<iframe 
src="https://drive.google.com/file/d/1xCSRGZl7J3Wl0JNFsg2zxpvGWsFV9ZWE/preview"
allow="autoplay"
allowfullscreen>
</iframe>

<br><br>

<button class="btn" onclick="toMemories()">Next → Memories</button>

</div>

<script>

function startFilm() {
const intro = document.getElementById('intro');
const fade = document.getElementById('fade');

fade.style.opacity = 1; // black screen

setTimeout(() => {
intro.style.display = 'none';
document.getElementById('videoSection').style.display = 'block';

setTimeout(() => {
document.getElementById('videoSection').style.opacity = '1';
fade.style.opacity = 0;
}, 800);

}, 800);
}

function toMemories() {
const fade = document.getElementById('fade');

fade.style.opacity = 1;

setTimeout(() => {
window.location.href = "memories.html";
}, 900);
}

</script>

</body>
</html>
