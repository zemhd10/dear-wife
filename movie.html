<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BIRTHDAY ORIGINALS</title>

<style>

body {
margin: 0;
background: radial-gradient(circle at center, #111 0%, #000 100%);
color: white;
font-family: Arial, sans-serif;
opacity: 0;
animation: fadeIn 1.2s ease forwards;
overflow: hidden;
}

/* =========================
   LOADING SCREEN
========================= */
#loadingScreen {
position: fixed;
width: 100%;
height: 100vh;
background: black;
display: flex;
justify-content: center;
align-items: center;
z-index: 999;
animation: fadeOutLoad 2.5s ease forwards;
animation-delay: 1.5s;
}

.logo {
color: red;
font-size: 28px;
letter-spacing: 4px;
text-shadow: 0 0 20px red;
}

/* =========================
   INTRO
========================= */
.intro {
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
transition: 0.8s ease;
}

.small {
color: #aaa;
letter-spacing: 3px;
font-size: 12px;
}

.subtitle {
color: #bbb;
margin-top: 10px;
}

h1 {
font-size: 42px;
margin: 10px 0;
}

h2 {
font-size: 28px;
margin-top: 10px;
}

.btn {
margin-top: 20px;
padding: 12px 25px;
background: red;
border: none;
color: white;
cursor: pointer;
font-size: 16px;
transition: 0.3s;
}

.btn:hover {
transform: scale(1.05);
}

/* =========================
   VIDEO SECTION
========================= */
.video-section {
padding: 40px;
text-align: center;
display: none;
opacity: 0;
transition: 1.2s ease;
}

video {
width: 80%;
max-width: 900px;
border-radius: 10px;
box-shadow: 0 0 25px rgba(255,0,0,0.2);
}

/* =========================
   MUSIC BUTTON
========================= */
.music-btn {
position: fixed;
bottom: 20px;
right: 20px;
z-index: 1000;
}

/* =========================
   ANIMATION
========================= */
@keyframes fadeIn {
to { opacity: 1; }
}

@keyframes fadeOutLoad {
to { opacity: 0; visibility: hidden; }
}

</style>
</head>

<body>

<!-- 🎬 LOADING -->
<div id="loadingScreen">
  <div class="logo">BIRTHDAY ORIGINALS</div>
</div>

<!-- 🎵 MUSIC (ONLY INTRO & MEMORIES) -->
<audio id="bgm" loop>
  <source src="music.mp3?v=3" type="audio/mp3">
</audio>

<!-- 🎞️ INTRO -->
<div class="intro" id="intro">

<p class="small">A BIRTHDAY ORIGINAL FILM</p>

<h1>Perjalanan Kita</h1>
<p class="subtitle">A story of love, time, and us</p>

<h2>Dewi Rinjani</h2>

<button class="btn" onclick="startFilm()">▶ Start Watching</button>

</div>

<!-- 🎬 VIDEO (SILENT ONLY) -->
<div class="video-section" id="videoSection">

<h1>Perjalanan Kita</h1>
<p>A Birthday Story of Love</p>

<video id="mainVideo" controls autoplay muted>
  <source src="video.mp4" type="video/mp4">
  Browser tidak mendukung video.
</video>

<br>

<button class="btn" onclick="goMemories()">Lihat Kenangan</button>
<button class="btn" onclick="goHome()">Kembali</button>

</div>

<!-- 🔊 MUSIC CONTROL -->
<button class="btn music-btn" onclick="toggleMusic()">🔊 Music</button>

<script>

function startFilm() {
document.getElementById('intro').style.opacity = '0';

const audio = document.getElementById("bgm");
audio.volume = 0.5;

/* 🎵 PLAY MUSIC (INTRO ONLY) */
audio.play().catch(() => {});

setTimeout(() => {
document.getElementById('intro').style.display = 'none';
document.getElementById('videoSection').style.display = 'block';

setTimeout(() => {
document.getElementById('videoSection').style.opacity = '1';
}, 100);

}, 700);
}

function toggleMusic() {
const audio = document.getElementById("bgm");

if(audio.paused){
audio.play();
} else {
audio.pause();
}
}

function goMemories() {
window.location.href = "memories.html";
}

function goHome() {
window.location.href = "index.html";
}

</script>

</body>
</html>
