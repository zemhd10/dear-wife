<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perjalanan Kita</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Arial,sans-serif;
overflow:hidden;
}

/* FADE LAYER */
#fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
z-index:9999;
transition:opacity 1s ease;
}

/* OPENING */
#opening{
position:absolute;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:#000;
z-index:100;
}

.logo{
font-size:42px;
font-weight:bold;
letter-spacing:6px;
color:#e50914;
text-shadow:0 0 20px rgba(229,9,20,.7);
animation:fadeIn 2s ease;
}

/* CHAPTER */
#chapter{
display:none;
position:absolute;
width:100%;
height:100vh;
background:#000;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
z-index:90;
}

.chapter-small{
letter-spacing:6px;
color:#999;
font-size:14px;
margin-bottom:15px;
}

.chapter-title{
font-size:64px;
font-weight:bold;
}

.chapter-sub{
margin-top:15px;
color:#bbb;
font-size:18px;
}

/* VIDEO */
#movie{
display:none;
width:100%;
height:100vh;
background:#000;
padding-top:20px;
text-align:center;
}

iframe{
width:90%;
max-width:1200px;
height:78vh;
border:none;
border-radius:10px;
}

/* BUTTONS */

.controls{
margin-top:20px;
}

.btn{
padding:14px 28px;
border:none;
background:#e50914;
color:white;
cursor:pointer;
border-radius:4px;
font-size:16px;
margin:0 8px;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* ANIMATION */

@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

</style>
</head>
<body>

<div id="fade"></div>

<!-- OPENING -->
<div id="opening">
<div class="logo">
BIRTHDAY ORIGINALS
</div>
</div>

<!-- CHAPTER -->
<div id="chapter">

<div class="chapter-small">
CHAPTER 1
</div>

<div class="chapter-title">
Perjalanan Kita
</div>

<div class="chapter-sub">
A Birthday Story of Love, Time, and Us
</div>

</div>

<!-- MOVIE -->
<div id="movie">

<iframe
src="https://drive.google.com/file/d/1xCSRGZl7J3Wl0JNFsg2zxpvGWsFV9ZWE/preview"
allow="autoplay"
allowfullscreen>
</iframe>

<div class="controls">

<button class="btn"
onclick="goMemories()">
💖 Lanjut ke Kenangan
</button>

<button class="btn"
onclick="goHome()">
🏠 Kembali
</button>

</div>

</div>

<script>

const fade = document.getElementById("fade");

window.onload = () => {

fade.style.opacity = "0";

setTimeout(() => {

fade.style.opacity = "1";

setTimeout(() => {

document.getElementById("opening").style.display="none";
document.getElementById("chapter").style.display="flex";

fade.style.opacity="0";

},1000);

},2500);

setTimeout(() => {

fade.style.opacity="1";

setTimeout(() => {

document.getElementById("chapter").style.display="none";
document.getElementById("movie").style.display="block";

fade.style.opacity="0";

},1000);

},5500);

};

function goMemories(){

fade.style.opacity="1";

setTimeout(()=>{
window.location.href="memories.html";
},800);

}

function goHome(){

fade.style.opacity="1";

setTimeout(()=>{
window.location.href="index.html";
},800);

}

</script>

</body>
</html>
