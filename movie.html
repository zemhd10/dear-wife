<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perjalanan Kita</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
overflow:hidden;
color:white;
}

/* =========================
FADE LAYER
========================= */

#fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
z-index:999;
pointer-events:none;
transition:opacity 1s ease;
}

/* =========================
OPENING
========================= */

#opening{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
z-index:100;
}

.logo{
font-size:48px;
font-weight:bold;
letter-spacing:8px;
color:#E50914;
text-shadow:0 0 25px rgba(229,9,20,.8);
}

/* =========================
CHAPTER
========================= */

#chapter{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
z-index:90;
}

.chapter-label{
letter-spacing:6px;
font-size:14px;
color:#999;
margin-bottom:20px;
}

.chapter-title{
font-size:72px;
font-weight:bold;
}

.chapter-subtitle{
margin-top:15px;
font-size:20px;
color:#ccc;
}

/* =========================
MOVIE
========================= */

#movie{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
z-index:1;
}

#movie iframe{
width:100%;
height:100%;
border:none;
}

/* =========================
CONTROLS
========================= */

.controls{
position:fixed;
bottom:30px;
right:30px;
display:flex;
gap:12px;
z-index:2000;
}

.btn{
padding:12px 22px;
border:none;
border-radius:5px;
background:#E50914;
color:white;
cursor:pointer;
font-size:15px;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<div id="fade"></div>

<!-- OPENING -->
<div id="opening">
<div class="logo">
BIRTHDAY ORIGINALS
</div>
</div>

<!-- CHAPTER -->
<div id="chapter">

<div class="chapter-label">
CHAPTER 1
</div>

<div class="chapter-title">
Perjalanan Kita
</div>

<div class="chapter-subtitle">
A Birthday Story of Love, Time, and Us
</div>

</div>

<!-- MOVIE -->
<div id="movie">

<iframe
src="https://drive.google.com/file/d/1xCSRGZl7J3Wl0JNFsg2zxpvGWsFV9ZWE/preview"
allow="autoplay"
allowfullscreen>
</iframe>

</div>

<!-- CONTROLS -->
<div class="controls">

<button class="btn" onclick="goMemories()">
💖 Kenangan
</button>

<button class="btn" onclick="goHome()">
🏠 Home
</button>

</div>

<script>

window.onload = function(){

const fade = document.getElementById("fade");

fade.style.opacity = "0";

setTimeout(() => {

fade.style.opacity = "1";

setTimeout(() => {

document.getElementById("opening").style.display = "none";
document.getElementById("chapter").style.display = "flex";

fade.style.opacity = "0";

},1000);

},2500);

setTimeout(() => {

fade.style.opacity = "1";

setTimeout(() => {

document.getElementById("chapter").style.display = "none";
document.getElementById("movie").style.display = "block";

fade.style.opacity = "0";

},1000);

},5500);

}

function goMemories(){

document.getElementById("fade").style.opacity = "1";

setTimeout(() => {
window.location.href = "memories.html";
},800);

}

function goHome(){

document.getElementById("fade").style.opacity = "1";

setTimeout(() => {
window.location.href = "index.html";
},800);

}

</script>

</body>
</html>
