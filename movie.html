<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Originals</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#000;
color:white;
overflow:hidden;
}

/* =========================
LOADING SCREEN
========================= */

#loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:loadingOut 3s forwards;
animation-delay:1.5s;
}

#loading h1{
color:#e50914;
font-size:42px;
letter-spacing:6px;
text-shadow:0 0 20px rgba(229,9,20,.7);
}

@keyframes loadingOut{
to{
opacity:0;
visibility:hidden;
}
}

/* =========================
BACKGROUND
========================= */

.hero-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(
to right,
rgba(0,0,0,.92) 25%,
rgba(0,0,0,.65) 60%,
rgba(0,0,0,.4) 100%
),
url('dewi.jpg');

background-size:cover;
background-position:center;
animation:zoomBg 20s ease-in-out infinite alternate;
}

@keyframes zoomBg{
from{
transform:scale(1);
}
to{
transform:scale(1.08);
}
}

/* =========================
INTRO
========================= */

#intro{
position:relative;
z-index:10;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding-left:80px;
max-width:700px;
}

.tag{
letter-spacing:4px;
font-size:12px;
color:#bdbdbd;
margin-bottom:15px;
opacity:0;
animation:fadeUp 1s forwards;
animation-delay:2s;
}

.title{
font-size:72px;
font-weight:bold;
line-height:1.05;
text-shadow:0 0 30px rgba(255,255,255,.15);
opacity:0;
animation:fadeUp 1s forwards;
animation-delay:2.5s;
}

.subtitle{
margin-top:20px;
font-size:20px;
line-height:1.7;
color:#d5d5d5;
opacity:0;
animation:fadeUp 1s forwards;
animation-delay:3s;
}

.name{
margin-top:25px;
font-size:28px;
color:#ff6b6b;
opacity:0;
animation:fadeUp 1s forwards;
animation-delay:3.5s;
}

.play-btn{
margin-top:35px;
padding:16px 32px;
font-size:18px;
border:none;
border-radius:6px;
background:#e50914;
color:white;
cursor:pointer;
width:220px;
opacity:0;
animation:fadeUp 1s forwards;
animation-delay:4s;
transition:.3s;
}

.play-btn:hover{
transform:scale(1.05);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* =========================
BLACK TRANSITION
========================= */

#fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:9998;
opacity:0;
pointer-events:none;
transition:1s;
}

/* =========================
CHAPTER
========================= */

#chapter{
display:none;
position:absolute;
width:100%;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
z-index:100;
text-align:center;
}

.chapter-small{
letter-spacing:6px;
color:#aaa;
margin-bottom:15px;
}

.chapter-title{
font-size:60px;
}

/* =========================
VIDEO
========================= */

#videoSection{
display:none;
position:absolute;
width:100%;
height:100vh;
background:black;
padding-top:40px;
text-align:center;
}

iframe{
width:85%;
max-width:1100px;
height:620px;
border:none;
border-radius:12px;
}

.video-title{
margin-bottom:15px;
font-size:36px;
}

.buttons{
margin-top:20px;
}

.btn{
padding:14px 26px;
margin:0 8px;
background:#e50914;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

</style>
</head>

<body>

<!-- Loading -->
<div id="loading">
<h1>BIRTHDAY ORIGINALS</h1>
</div>

<!-- Background -->
<div class="hero-bg"></div>

<!-- Fade Layer -->
<div id="fade"></div>

<!-- Intro -->
<div id="intro">

<div class="tag">
A BIRTHDAY ORIGINAL FILM
</div>

<div class="title">
Happy Birthday,<br>
Dewi Rinjani
</div>

<div class="subtitle">
A collection of memories, laughter,
love, and moments that made this year beautiful.
</div>

<div class="name">
Made with Love ❤️
</div>

<button class="play-btn" onclick="startFilm()">
▶ Begin The Story
</button>

</div>

<!-- Chapter -->
<div id="chapter">

<div class="chapter-small">
CHAPTER 1
</div>

<div class="chapter-title">
Perjalanan Kita
</div>

</div>

<!-- Video -->
<div id="videoSection">

<div class="video-title">
Perjalanan Kita
</div>

<iframe
src="https://drive.google.com/file/d/1xCSRGZl7J3Wl0JNFsg2zxpvGWsFV9ZWE/preview"
allow="autoplay"
allowfullscreen>
</iframe>

<div class="buttons">

<button class="btn"
onclick="location.href='memories.html'">
💖 Lihat Kenangan
</button>

<button class="btn"
onclick="location.href='index.html'">
🏠 Home
</button>

</div>

</div>

<script>

function startFilm(){

document.getElementById("fade").style.opacity="1";

setTimeout(()=>{

document.getElementById("intro").style.display="none";

document.getElementById("chapter").style.display="flex";

document.getElementById("fade").style.opacity="0";

},1000);

setTimeout(()=>{

document.getElementById("fade").style.opacity="1";

},3500);

setTimeout(()=>{

document.getElementById("chapter").style.display="none";

document.getElementById("videoSection").style.display="block";

document.getElementById("fade").style.opacity="0";

},4500);

}

</script>

</body>
</html>
